# Docs site — GitHub Pages (Jekyll, same-shape tree).
# Not Merge CI. Spec: openspec/specs/docs-site (via change docs-github-pages).
# ADR 0051.

name: Docs site

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "CONTEXT.md"
      - "CONTENT_LAYOUT.md"
      - "README.md"
      - ".github/workflows/docs-pages.yml"
      - ".github/pages/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble publish tree
        run: |
          set -euo pipefail
          mkdir -p publish
          cp README.md AGENTS.md CONTEXT.md CONTENT_LAYOUT.md publish/
          cp -a docs publish/docs
          cp .github/pages/_config.yml publish/_config.yml
          cp docs/index.md publish/index.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./publish
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
